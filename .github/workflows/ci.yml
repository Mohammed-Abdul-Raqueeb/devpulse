name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch cancels an in-flight run rather than queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JWT_SECRET: ci-secret-value-at-least-32-characters-long

jobs:
  verify:
    name: Lint, typecheck and test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run coverage

      - name: Upload coverage
        if: matrix.node == 24
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-24.04
    needs: verify

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Upload dashboard build
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: packages/web/dist/
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    needs: verify

    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t devpulse:ci .

      - name: Smoke test the image
        run: |
          docker run -d --name devpulse-ci \
            -e JWT_SECRET="$JWT_SECRET" \
            -e DATABASE_PATH=/tmp/ci.db \
            -p 4000:4000 devpulse:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4000/health/live; then exit 0; fi
            sleep 1
          done
          echo "container did not become healthy" >&2
          docker logs devpulse-ci
          exit 1
